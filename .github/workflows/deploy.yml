name: Build & Deploy (self-hosted server)

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: layai-backend
            context: ./apps/backend
            dockerfile: ./apps/backend/Dockerfile
          - image: layai-student-web
            context: .
            dockerfile: ./apps/student-web/Dockerfile
          - image: layai-lecturer-web
            context: .
            dockerfile: ./apps/lecturer-web/Dockerfile
          - image: layai-admin-web
            context: .
            dockerfile: ./apps/admin-web/Dockerfile

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (personal namespace)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_OWNER }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build & Push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ secrets.GHCR_OWNER }}/${{ matrix.image }}:sha-${{ github.sha }}

  deploy:
    runs-on: [self-hosted, layai-server]
    needs: build_and_push

    steps:
      - name: Pull & restart on server
        shell: bash
        run: |
          cd "$HOME/${{ secrets.DEPLOY_PATH }}"
          export GHCR_OWNER="${{ secrets.GHCR_OWNER }}"
          export IMAGE_TAG="sha-${{ github.sha }}"
          echo "${{ secrets.GHCR_PULL_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_OWNER }}" --password-stdin
          docker compose pull
          docker compose up -d