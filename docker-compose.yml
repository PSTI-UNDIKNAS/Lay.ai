services:
  database:
    # image: postgres:17-alpine
    image: pgvector/pgvector:0.8.1-pg17-trixie #postgres 17 + pgvector
    restart: unless-stopped
    environment:
      # These values are now read from your .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432" # Use variables for ports too
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/layai-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      # You can pass variables to your backend app too
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - database

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "3000:3000"  # Single external entry point
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - student-web
      - lecturer-web
      - admin-web

  admin-web:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/layai-admin-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend

  lecturer-web:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/layai-lecturer-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend

  student-web:
    image: ghcr.io/${GHCR_OWNER:?set GHCR_OWNER}/layai-student-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      - backend

  seed-admin:
    image: golang:1.23-alpine
    working_dir: /app
    volumes:
      - ./apps/backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - database
    command: go run ./cmd/seed-admin
    profiles:
      - tools  # This prevents it from starting automatically
    stdin_open: true  # Enable interactive input
    tty: true        # Enable TTY for interactive prompts

volumes:
  db-data:
