services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      # These values are now read from your .env file
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT}:5432" # Use variables for ports too
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./apps/backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      # You can pass variables to your backend app too
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - database

  seed-admin:
    image: golang:1.23-alpine
    working_dir: /app
    volumes:
      - ./apps/backend:/app
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      - database
    command: go run ./cmd/seed-admin
    profiles:
      - tools  # This prevents it from starting automatically
    stdin_open: true  # Enable interactive input
    tty: true        # Enable TTY for interactive prompts

volumes:
  db-data: